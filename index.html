<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot the FLAGS – Year 7</title>
<style>
:root{
  --navy:#1B2A4A; --ink:#16203A; --teal:#1F8F88; --teal-lt:#7FD4CE; --amber:#D98A0B;
  --amber-lt:#FFF4D6; --bg:#F4F6FA; --card:#FFFFFF; --line:#C9D2E4; --muted:#6B7691;
  --good:#1E8E4E; --good-lt:#E3F5EA; --bad:#C0392B; --bad-lt:#FBE8E8; --zebra:#EEF2F9;
  --chat:#E9EEF6; --me:#D7F2EF; --game:#24304F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.45}
button{font:inherit;cursor:pointer}
.top{background:var(--navy);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:22px}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--teal-lt);letter-spacing:1px;text-transform:uppercase}
.score{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.score span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-size:15px}
.score b{color:#ffb4a8}
.rule{background:var(--bad);color:#fff;text-align:center;padding:8px 16px;font-weight:700;font-size:16px}
main{max-width:1180px;margin:0 auto;padding:20px 20px 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:28px;color:var(--navy);margin:0 0 8px}
h2{font-size:23px;color:var(--navy);margin:0 0 10px}
h3{font-size:19px;color:var(--navy);margin:0 0 6px}
.kicker{color:var(--teal);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:15px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:700}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.note{background:var(--zebra);border-radius:10px;padding:12px 16px;font-size:16px}
.talk{background:var(--amber-lt);border-left:5px solid var(--amber);border-radius:8px;padding:10px 14px;font-size:16px;margin-top:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}

/* FLAGS card */
.flags{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.flags div{background:var(--bad-lt);border:1.5px solid var(--bad);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.3}
.flags b{display:block;color:var(--navy);font-size:15px}
.flags b span{color:var(--bad);font-size:22px;margin-right:4px}

/* phone */
.scene{display:grid;grid-template-columns:430px 1fr;gap:24px;align-items:start}
.phone{background:#fff;border:10px solid var(--navy);border-radius:34px;overflow:hidden;box-shadow:0 8px 24px rgba(27,42,74,.18)}
.phead{background:var(--game);color:#fff;padding:10px 16px 12px;display:flex;align-items:center;gap:10px}
.phead .gname{font-weight:700;font-size:17px}
.phead .gsub{font-size:12px;color:var(--teal-lt)}
.pbody{background:var(--chat);height:560px;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.av{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.sys{align-self:center;background:rgba(27,42,74,.08);color:var(--muted);font-size:13px;border-radius:999px;padding:4px 12px;text-align:center}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:90%}
.bub{background:#fff;border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:16px;line-height:1.35;box-shadow:0 1px 1px rgba(0,0,0,.06);border:2px solid transparent;text-align:left;color:var(--ink)}
.bub .nm{font-size:12px;font-weight:700;margin-bottom:2px;color:#E67E22}
.bub .tm{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
button.bub{cursor:pointer}
button.bub:hover{border-color:var(--amber)}
.bub.sel{border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,42,74,.15)}
.bub.found{border-color:var(--bad);background:var(--bad-lt)}
.bub.clear{border-color:var(--good);background:var(--good-lt)}
.bub .tag{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;color:#fff;background:var(--bad);border-radius:999px;padding:1px 8px}
.bub.clear .tag{background:var(--good)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--me);border-radius:14px 14px 4px 14px}

/* right panel */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pick button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 8px;font-size:15px;color:var(--ink);text-align:left;line-height:1.25}
.pick button b{display:block;font-size:20px;color:var(--bad)}
.pick button.none b{color:var(--good)}
.pick button:hover:not(:disabled){border-color:var(--teal)}
.pick button:disabled{opacity:.5;cursor:default}
.quote{background:var(--zebra);border-radius:10px;padding:10px 14px;font-size:17px;margin-top:8px}
.fb{border-radius:12px;padding:14px 16px;margin-top:14px;border:2px solid}
.fb p{margin:4px 0}
.fb .lab{display:inline-block;font-weight:700;font-size:13px;letter-spacing:1px;border-radius:999px;padding:3px 12px;color:#fff;margin-bottom:6px}
.fb.good{background:var(--good-lt);border-color:var(--good)} .fb.good .lab{background:var(--good)}
.fb.mid{background:var(--amber-lt);border-color:var(--amber)} .fb.mid .lab{background:var(--amber)}
.fb.bad{background:var(--bad-lt);border-color:var(--bad)} .fb.bad .lab{background:var(--bad)}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink)}
.choice:hover:not(:disabled){border-color:var(--teal)}
.choice .L{flex:0 0 34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.choice.picked{border-color:var(--navy);background:var(--zebra)}
.choice:disabled{opacity:.55;cursor:default}
.choice.picked:disabled{opacity:1}
table.sum{width:100%;border-collapse:collapse;margin-top:10px;font-size:16px}
table.sum th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px}
table.sum td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.sum tr:nth-child(even) td{background:var(--zebra)}
.tell{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.tell div{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:15px}
.tell b{display:block;color:var(--navy);font-size:16px;margin-bottom:2px}
@media (max-width:960px){.scene,.two{grid-template-columns:1fr}.flags{grid-template-columns:1fr 1fr}.phone{max-width:450px;margin:0 auto}.tell{grid-template-columns:1fr}}
</style>
</head>

  F:["Flattery","Too much praise, to make you like them."],

  A:["Asks for photos or details","Your school, where you live, a photo of you."],

  {id:9, who:"Zak", x:"send me a selfie so I know ur real 😄", tm:"8:16 pm", flag:"A",

  {id:10, who:"Zak", x:"and dont tell ur parents about me. they wont get it", tm:"8:17 pm", flag:"S",
   why:"Asking you to keep them secret from your parents. This is the biggest warning sign of all."},

const TOTAL = CHAT.filter(c=>c.flag).length;   // 6

let state = {};      // id -> {letter, right}
let selected = null;
let phase = "intro"; // intro | spot | decide | end
let decision = null;

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function av(who){
  if (who==="Omar") return `<div class="av" style="background:#1F8F88">${OMAR_IMG?`<img src="${OMAR_IMG}" alt="">`:"O"}</div>`;
  return `<div class="av" style="background:#E67E22">${ZAK_IMG?`<img src="${ZAK_IMG}" alt="">`:"🦊"}</div>`;
}
function flagsCard(){
  return `<div class="flags">${Object.entries(FLAGS).map(([k,[n,d]])=>`<div><b><span>${k}</span>${n}</b>${d}</div>`).join('')}</div>`;
}
function counts(){
  let found=0, falseAlarm=0;
  for (const c of CHAT){ if(!c.id) continue; const s=state[c.id]; if(!s) continue;
    if (c.flag && s.right) found++; if (!c.flag && s.letter!=="none" && s.letter!==c.alt) falseAlarm++; }
  return {found, falseAlarm};
}
function score(){
  const el=document.getElementById('score');
  if (phase==="intro"){ el.innerHTML=""; return; }
  const {found,falseAlarm}=counts();
  el.innerHTML=`<span>Flags found: <b>${found} / ${TOTAL}</b></span><span>False alarms: ${falseAlarm}</span>`;
}

/* ------------------------------------------------------------ intro */
function intro(){
  phase="intro"; state={}; selected=null; decision=null; score();
  app.innerHTML=`
  <div class="panel two">
    <div>
      <div class="kicker">Before you start</div>
      <h1>Omar has a new friend in his game.</h1>
      <p>Omar plays <b>Sky Builders</b>. A player called <b>Zak_13</b> sends him a friend request.
         Over one week, they chat. Some messages are fine. Some are <b>red flags</b>.</p>
      <ol style="padding-left:24px;margin:8px 0">
        <li><b>Pairs.</b> One person clicks. One person reads aloud.</li>
        <li><b>Click a message from Zak.</b> Then choose its flag, or <i>not a flag</i>.</li>
        <li><b>Say why first:</b> “I think this is … because …”</li>
        <li>Find all ${TOTAL} flags. Then decide what Omar should do.</li>
      </ol>
      <div class="row"><button class="btn" onclick="spot()">Open the chat ▶</button></div>
    </div>
    <div>
      <h3>The five FLAGS</h3>
      ${flagsCard()}
      <div class="note" style="margin-top:14px">Nothing you click is saved or sent anywhere.
      Zak_13 is made up. We never find out who is really behind the account — and in real life, you can't either.</div>
    </div>
  </div>`;
}

/* ------------------------------------------------------------ chat */
function chatHTML(){
  return CHAT.map(c=>{
    if (c.t==="sys") return `<div class="sys">${esc(c.x)}</div>`;
    if (c.t==="me") return `<div class="msg me">${av("Omar")}<div class="bub">${esc(c.x)}<div class="tm">${esc(c.tm)}</div></div></div>`;
    const s=state[c.id];
    let cls="bub", tag="";
    if (s && s.right){ cls += c.flag ? " found" : " clear"; tag = c.flag ? `<span class="tag">${c.flag} · ${FLAGS[c.flag][0]}</span>` : (s.letter===c.alt ? `<span class="tag">${c.alt}? fair — but on its own, not a big flag</span>` : `<span class="tag">not a flag</span>`); }
    if (selected===c.id) cls+=" sel";
    const dis = (phase!=="spot") ? "disabled" : "";
    return `<div class="msg">${av("Zak")}<button class="${cls}" ${dis} onclick="sel(${c.id})"><div class="nm">Zak_13</div>${esc(c.x)}${tag?'<br>'+tag:''}<div class="tm">${esc(c.tm)}</div></button></div>`;
  }).join('');
}
function phone(){
  return `<div class="phone"><div class="phead">${av("Zak")}<div><div class="gname">Zak_13</div><div class="gsub">Sky Builders · friend since Sunday</div></div></div>
          <div class="pbody" id="pbody">${chatHTML()}</div></div>`;
}
function redrawChat(){
  const pb=document.getElementById('pbody'); const top=pb.scrollTop;
  pb.innerHTML=chatHTML(); pb.scrollTop=top; score();
}

function spot(){
  phase="spot"; score();
  app.innerHTML=`<div class="scene">${phone()}<div class="panel" id="side"></div></div>`;
  side();
}
function side(){
  const {found}=counts();
  const el=document.getElementById('side');
  if (selected===null){
    el.innerHTML=`<div class="kicker">Spot the flags</div>
      <h2>Click a message from Zak.</h2>
      <p>Scroll down — the chat lasts a week. You have found <b>${found} of ${TOTAL}</b> flags.</p>
      ${flagsCard()}
      <div class="talk">Careful: not every message is a flag. A false alarm costs nothing in real life — but here, try to be exact.</div>
      <div class="row"><button class="btn" onclick="decide()">${found<TOTAL?'I think I have found them all ▶':'All flags found — decide what Omar does ▶'}</button></div>`;
    return;
  }
  const c=CHAT.find(m=>m.id===selected); const s=state[c.id];
  el.innerHTML=`<div class="kicker">Message from Zak_13 · ${esc(c.tm)}</div>
    <div class="quote">“${esc(c.x)}”</div>
    <p style="margin:12px 0 0"><b>Is this a red flag? Which one?</b> Say why first: “I think this is … because …”</p>
    <div class="pick" id="pick">
      ${Object.entries(FLAGS).map(([k,[n]])=>`<button onclick="answer('${k}')"><b>${k}</b>${n}</button>`).join('')}
      <button class="none" onclick="answer('none')"><b>✓</b>Not a flag</button>
    </div>
    <div id="fb">${s?fbHTML(c,s):''}</div>
    <div class="row"><button class="btn ghost" onclick="selected=null;redrawChat();side()">Back to the chat</button></div>`;
  if (s && s.right) document.querySelectorAll('#pick button').forEach(b=>b.disabled=true);
}
function sel(id){ selected=id; redrawChat(); side(); }
function answer(letter){
  const c=CHAT.find(m=>m.id===selected);
  const right = c.flag ? letter===c.flag : (letter==="none" || letter===c.alt);
  state[c.id]={letter,right};
  redrawChat();
  document.getElementById('fb').innerHTML=fbHTML(c,state[c.id]);
  if (right) document.querySelectorAll('#pick button').forEach(b=>b.disabled=true);
}
function fbHTML(c,s){
  if (s.right){
    return `<div class="fb ${c.flag?'bad':'good'}"><span class="lab">${c.flag?'RED FLAG: '+c.flag+' · '+FLAGS[c.flag][0].toUpperCase():'NOT A FLAG'}</span><p>${esc(c.why)}</p></div>`;
  }
  if (c.flag && s.letter==="none") return `<div class="fb mid"><span class="lab">LOOK AGAIN</span><p>This one IS a red flag. Which of the five is it?</p></div>`;
  if (c.flag) return `<div class="fb mid"><span class="lab">CLOSE</span><p>It is a red flag — but a different one. Read the five again.</p></div>`;
  return `<div class="fb mid"><span class="lab">LOOK AGAIN</span><p>Is this really a warning sign on its own? Think about what a normal player would say.</p></div>`;
}

/* ------------------------------------------------------------ decide */
const OPTS = [
  {t:"Reply: “Are you really 13? Prove it.”", k:"mid", lab:"NOT YET",
   fb:["There is no way Zak can prove it online. He can type anything, and send any photo.","Asking keeps the chat going. STOP starts with S: stop replying."]},
  {t:"Send one selfie so Zak knows he is real too.", k:"bad", lab:"NO",
   fb:["Never send photos to someone you only know online.","Once a photo is sent, you cannot get it back. Remember Lesson 02."]},
  {t:"Stop replying. Take screenshots. Block and report Zak. Tell a parent.", k:"good", lab:"STOP: ALL FOUR",
   fb:["Stop. Take a screenshot. Opt out: block and report. Pass it on: tell a trusted adult.","Omar is not in trouble. He did the right thing by telling."]},
  {t:"Keep chatting, but don't tell Zak anything else.", k:"mid", lab:"NOT SAFE",
   fb:["Zak has already asked for secrets, a selfie and Omar's school.","The pattern is there. Do not wait for more flags. Tell an adult now."]}
];
function decide(){
  phase="decide"; selected=null; score();
  app.innerHTML=`<div class="scene">${phone()}<div class="panel" id="side"></div></div>`;
  const {found}=counts();
  document.getElementById('side').innerHTML=`<div class="kicker">Saturday · 8:18 pm</div>
    <h2>What should Omar do now?</h2>
    <p class="small">You found <b>${found} of ${TOTAL}</b> flags. ${found<TOTAL?'The ones you missed are still in the chat — check them at the end.':''}</p>
    <div class="talk">Talk first. Start like this: <b>“Omar should … because …”</b></div>
    <div class="choices">${OPTS.map((o,j)=>`<button class="choice" data-j="${j}" onclick="pickOpt(${j})"><span class="L">${'ABCD'[j]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div id="dfb"></div>`;
}
function pickOpt(j){
  if (decision===null) decision=j;
  const o=OPTS[j];
  document.querySelectorAll('.choice').forEach(b=>{b.classList.toggle('picked',+b.dataset.j===j); b.disabled=true;});
  document.getElementById('dfb').innerHTML=`<div class="fb ${o.k}"><span class="lab">${o.lab}</span>${o.fb.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
    <p class="small muted" style="margin:8px 0 0">Your first choice: <b>${'ABCD'[decision]}</b>. Write it in Part 2.</p>
    <div class="row"><button class="btn ghost" onclick="decide()">Try another choice</button><button class="btn" onclick="end()">Finish ▶</button></div>`;
}

/* ------------------------------------------------------------ end */
function end(){
  phase="end"; score();
  const rows=CHAT.filter(c=>c.flag).map(c=>{
    const s=state[c.id]; const ok=s&&s.right;
    return `<tr><td><b style="color:var(--bad)">${c.flag}</b> · ${FLAGS[c.flag][0]}</td><td>“${esc(c.x)}”</td><td>${ok?'✅ found':'— missed'}</td></tr>`;
  }).join('');
  const {found,falseAlarm}=counts();
  app.innerHTML=`<div class="panel">
    <div class="kicker">The end of the week</div>
    <h1>You found ${found} of ${TOTAL} flags</h1>
    <p class="small">False alarms: ${falseAlarm}. Your first choice for Omar: <b>${decision===null?'—':'ABCD'[decision]}</b>.</p>
    <table class="sum"><tr><th>Flag</th><th>The message</th><th>You</th></tr>${rows}</table>
    <div class="talk" style="margin-top:16px"><b>Zak has chatted with Omar for a week. Is Zak a friend or a stranger?</b><br>
      Still a stranger. Omar cannot check his name, his age or his face. Start like this: <b>“Zak is still a stranger because …”</b></div>
    <h3 style="margin-top:18px">Three ways to report</h3>
    <div class="tell">
      <div><b>1 · In the app</b>Block the account, then press Report.</div>
      <div><b>2 · At school</b>Any teacher you feel comfortable with: your form tutor, a subject teacher or the counsellor.</div>
      <div><b>3 · An adult at home</b>They can report it to the police cybercrime team.</div>
    </div>
    <div class="talk">Talk with your partner: <b>which flag was the hardest to spot? Why?</b></div>
    <div class="row"><button class="btn ghost" onclick="intro()">Start again</button></div>
  </div>`;
}
intro();
</script>
</body>
</html>
